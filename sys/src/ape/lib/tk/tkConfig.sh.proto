# tkConfig.sh for APExp -- GENERATED by ../mkfile, do not edit.
#
# The companion to `../tcl/tclConfig.sh.proto', and the long reasoning
# is there: a TEA configure refuses without it, a Linux-flavoured
# `tclConfig.sh' is already committed under `external/tcl/unix' and
# must not be the one found, and a file GENERATED by the mkfile that
# does the build cannot drift from it the way this tree's
# hand-maintained capability files keep doing.
#
# `TK_LIBS' is the rest of what `cmd/wish/mkfile' links beside libtk:
# libtcl, libdraw, libpng, libz, libap -- in that order, because the
# link is sequential and libdraw is what the Plan 9 backend calls.
# **There is no X here**, so nothing names X11; `tk/plan9' draws on
# `/dev/draw' directly, which is why `TK_XINCLUDES' and `TK_XLIBSW' are
# empty rather than missing.

TK_VERSION='@TKVER@'
TK_MAJOR_VERSION='@TKMAJOR@'
TK_MINOR_VERSION='@TKMINOR@'
TK_PATCH_LEVEL='@TKPATCH@'

TK_CC='pcc'

# Exactly ../mkfile's CFLAGS defines.
TK_DEFS='-DHAVE_TCL_CONFIG_H -DHAVE_TK_CONFIG_H -DPLAN9 -DMODULE_SCOPE=extern -DWCHAR=char -DTK_PLATFORM="plan9" -DSTATIC_BUILD'

TK_SHARED_BUILD='0'
TK_LIB_FILE='libtk.a'
TK_LIB_FLAG=''
TK_LIB_SPEC='/@OBJTYPE@/lib/ape/libtk.a'
TK_BUILD_LIB_SPEC='/@OBJTYPE@/lib/ape/libtk.a'
TK_SRC_DIR='@ROOT@/sys/src/external/tk'
TK_INCLUDE_SPEC='-I/sys/include/ape'

TK_LIBS='/@OBJTYPE@/lib/ape/libtcl.a /@OBJTYPE@/lib/ape/libdraw.a /@OBJTYPE@/lib/ape/libpng.a /@OBJTYPE@/lib/ape/libz.a /@OBJTYPE@/lib/ape/libap.a'

TK_PREFIX='/'
TK_EXEC_PREFIX='/'

# No X server and no dlopen: both of these are facts, not omissions.
TK_XINCLUDES=''
TK_XLIBSW=''
TK_SHARED_LIB_SUFFIX=''
TK_UNSHARED_LIB_SUFFIX='.a'

# No stub mechanism; nothing here is loadable.  See the tcl proto.
TK_SUPPORTS_STUBS='0'
TK_STUB_LIB_FILE=''
TK_STUB_LIB_FLAG=''
TK_STUB_LIB_SPEC=''
TK_STUB_LIB_PATH=''
TK_BUILD_STUB_LIB_SPEC=''
TK_BUILD_STUB_LIB_PATH=''
