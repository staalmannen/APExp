# tclConfig.sh for APExp -- GENERATED by ../mkfile, do not edit.
#
# WHY THIS FILE EXISTS AT ALL.  A TEA configure (tkcon's, and every Tcl
# extension's) refuses to go on without it:
#
#	checking for Tcl configuration... configure: error: Can't find Tcl
#	configuration definitions.  Use --with-tcl to specify a directory
#	containing tclConfig.sh
#
# ***AND ONE ALREADY EXISTED IN THE TREE, DESCRIBING LINUX.***
# `sys/src/external/tcl/unix/tclConfig.sh' is tracked in git and is the
# output of somebody's `configure' run on glibc: `TCL_CC='cc'',
# `-O2', `TCL_SHLIB_EXT='.so'', `NOTIFIER_EPOLL', `HAVE_SYS_EPOLL_H',
# `HAVE_CPUID', `MODULE_SCOPE=extern __attribute__((visibility(...)))'.
# **A configure that found THAT would have been told to build with a
# compiler this system does not have, against a notifier it does not
# have, producing a shared library it cannot load.** It is upstream's
# build output committed by accident, and it is not this file.
#
# WHY IT IS GENERATED RATHER THAN HAND-MAINTAINED.  The single most
# repeated bug in this tree is a hand-answered capability file drifting
# from the build it claims to describe -- perl's `config.h' and its
# `Config.pm', bash's `config.h', the six `SIZEOF_*' files that still
# say amd64 on every target.  *A tclConfig.sh written by the mkfile
# that does the build cannot be wrong about the build*, so the flags
# below come from `../mkfile' and the paths from `$objtype' at install
# time.  **If you change CFLAGS there, change TCL_DEFS here.**
#
# WHY THE PATHS ARE ABSOLUTE AND UNPREFIXED.  Inside `apexp-sh',
# `mount-include' has bound this tree over the system locations, so
# `/$objtype/lib/ape' and `/sys/include/ape' ARE APExp's.  An extension
# configured in that namespace wants those names, not the repository's
# relative ones -- which is also why `TCL_PREFIX' is `/' rather than a
# directory nothing installs into.
#
# WHAT IS DELIBERATELY EMPTY, and each is a platform fact rather than a
# gap: Plan 9 has no dlopen, so there are no shared libraries, no stub
# library, no `.so' suffix and no `-ldl'.  An extension that insists on
# a loadable module cannot work here whatever this file says; one that
# can be linked statically into its own interpreter can.

TCL_VERSION='@TCLVER@'
TCL_MAJOR_VERSION='@TCLMAJOR@'
TCL_MINOR_VERSION='@TCLMINOR@'
TCL_PATCH_LEVEL='@TCLPATCH@'

# pcc, not cc: APExp's Tcl is built by the Plan 9 C compiler.
TCL_CC='pcc'

# Exactly ../mkfile's CFLAGS defines.  -DWCHAR=char is load-bearing and
# its reason is in that mkfile; -DMODULE_SCOPE=extern is because kencc
# has no visibility attribute.
TCL_DEFS='-DHAVE_TCL_CONFIG_H -DPLAN9 -DMODULE_SCOPE=extern -DWCHAR=char -DMP_FIXED_CUTOFFS'

# pcc takes neither -g nor -O2; the build passes neither.
TCL_CFLAGS_DEBUG=''
TCL_CFLAGS_OPTIMIZE=''
TCL_LDFLAGS_DEBUG=''
TCL_LDFLAGS_OPTIMIZE=''

# Static only.  See the note above about dlopen.
TCL_SHARED_BUILD='0'
TCL_LIB_FILE='libtcl.a'
TCL_LIB_FLAG=''
TCL_LIB_SPEC='/@OBJTYPE@/lib/ape/libtcl.a'
TCL_BUILD_LIB_SPEC='/@OBJTYPE@/lib/ape/libtcl.a'
TCL_SHARED_LIB_SUFFIX=''
TCL_UNSHARED_LIB_SUFFIX='.a'
TCL_SHLIB_SUFFIX=''
TCL_SHLIB_CFLAGS=''
TCL_SHLIB_LD=''
TCL_SHLIB_LD_LIBS=''
TCL_STLIB_LD='ar cr'
TCL_DL_LIBS=''
TCL_LD_FLAGS=''
TCL_CC_SEARCH_FLAGS=''
TCL_LD_SEARCH_FLAGS=''
TCL_LIB_VERSIONS_OK='nodots'
TCL_RANLIB='echo'
TCL_COMPAT_OBJS=''
TCL_EXTRA_CFLAGS=''
TCL_CFLAGS_WARNING=''

# tclsh links libtcl.a against libz.a (see cmd/tclsh/mkfile).  Named by
# full path rather than -lz: pcc here is driven with explicit archives
# and there is no library search path to rely on.
TCL_LIBS='/@OBJTYPE@/lib/ape/libz.a'

TCL_PREFIX='/'
TCL_EXEC_PREFIX='/'
TCL_INCLUDE_SPEC='-I/sys/include/ape'
TCL_SRC_DIR='@ROOT@/sys/src/external/tcl'
TCL_PACKAGE_PATH='/sys/lib/tcl'

# No stub mechanism: it exists to let a loadable module resolve against
# whatever interpreter loaded it, and nothing here is loadable.
TCL_SUPPORTS_STUBS='0'
TCL_STUB_LIB_FILE=''
TCL_STUB_LIB_FLAG=''
TCL_STUB_LIB_SPEC=''
TCL_STUB_LIB_PATH=''
TCL_BUILD_STUB_LIB_SPEC=''
TCL_BUILD_STUB_LIB_PATH=''

TCL_ZIP_FILE=''
